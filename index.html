<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D14" />
    <meta name="description" content="Kira Art Design — custom software for schools, shops, clinics & cafes in Tajikistan. We automate your business." />
    <title>Kira Art Design — We Automate Your Business</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA — restore full path from the 404 redirect hack
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
